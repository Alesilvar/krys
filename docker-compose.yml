services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: krys
      POSTGRES_USER: krys
      POSTGRES_PASSWORD: krys_dev_password
    ports:
      - "5433:5432"
    volumes:
      - krys_postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krys -d krys"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  krys_postgres18_data:
